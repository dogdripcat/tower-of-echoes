function normalizeMonsterArt(img){
  if(!img||img.dataset.alphaNormalized==='1'||!img.complete||!img.naturalWidth)return;
  const src=img.currentSrc||img.src;
  if(monsterAlphaCache.has(src)){img.src=monsterAlphaCache.get(src);img.dataset.alphaNormalized='1';return}
  try{
    const canvas=document.createElement('canvas'),ctx=canvas.getContext('2d',{willReadFrequently:true});
    canvas.width=img.naturalWidth;canvas.height=img.naturalHeight;ctx.drawImage(img,0,0);
    const data=ctx.getImageData(0,0,canvas.width,canvas.height).data;let left=canvas.width,top=canvas.height,right=-1,bottom=-1;
    for(let y=0;y<canvas.height;y++)for(let x=0;x<canvas.width;x++)if(data[(y*canvas.width+x)*4+3]>8){left=Math.min(left,x);top=Math.min(top,y);right=Math.max(right,x);bottom=Math.max(bottom,y)}
    if(right<left||bottom<top)return;
    const pad=2,width=right-left+1,height=bottom-top+1,normalizedCanvas=document.createElement('canvas');

}

function grantStartingRelic(hero){

function bagDimensions(modifier=state.bagModifier||0){return{cols:Math.max(2,4+state.stage+modifier),rows:Math.max(2,3+state.stage+modifier)}}
function packBag(items=state.inventory||[],dims=bagDimensions()){
  items=(items||[]).filter(item=>item.type==='relic');
  const cells=Array.from({length:dims.rows},()=>Array(dims.cols).fill(false)),placements=[];
  const ordered=[...items.filter(item=>Number.isInteger(item.col)&&Number.isInteger(item.row)),...items.filter(item=>!Number.isInteger(item.col)||!Number.isInteger(item.row))];
  for(const item of ordered){
    const valid=(row,col)=>row>=0&&col>=0&&row+item.h<=dims.rows&&col+item.w<=dims.cols&&Array.from({length:item.h},(_,y)=>Array.from({length:item.w},(_,x)=>!cells[row+y][col+x]).every(Boolean)).every(Boolean);
    let row=item.row,col=item.col;
    if(Number.isInteger(row)&&Number.isInteger(col)){if(!valid(row,col))return null}
    else{row=-1;for(let y=0;y<=dims.rows-item.h&&row<0;y++)for(let x=0;x<=dims.cols-item.w;x++)if(valid(y,x)){row=y;col=x;break}if(row<0)return null}
    for(let y=row;y<row+item.h;y++)for(let x=col;x<col+item.w;x++)cells[y][x]=true;
    placements.push({item,row,col});
  }
  return placements;
}

function availablePotions(source='reward'){const hero=HEROES[state.hero]?.name;return POTION_DATABASE.filter(item=>(!item.character||item.character===hero)&&(source==='event'||!item.eventOnly)&&(source!=='alchemist'||item.grade!=='A'))}
function weightedItem(items,weights){const pool=items.flatMap(item=>Array(weights[item.grade]||0).fill(item));return pool.length?pool[Math.floor(toeRandom()*pool.length)]:null}
function availableRelics(source='reward',kind=state.encounterKind||'normal'){
  const hero=HEROES[state.hero]?.name,weights=source==='shop'?RELIC_REWARD_WEIGHTS.shop:RELIC_REWARD_WEIGHTS[kind]||RELIC_REWARD_WEIGHTS.normal;
  const pool=RELIC_DATABASE.filter(item=>(!item.character||item.character===hero)&&!state.inventory.some(owned=>owned.id===item.id||owned.relicId===item.id)&&(source==='event'||!item.eventOnly)&&(['event','explicitCurse'].includes(source)||item.scope!=='cursed')&&(source!=='shop'||item.grade!=='S'));
  return{pool,weights};
}
function rollRelic(source='reward',kind=state.encounterKind||'normal'){const {pool,weights}=availableRelics(source,kind),base=weightedItem(pool,weights);return base?{...base,relicId:base.id,type:'relic',id:crypto.randomUUID()}:null}
function makeBagItem(type,source='reward'){
  if(type==='potion'){const pool=availablePotions(source),base=pool[Math.floor(toeRandom()*pool.length)];return{...base,potionId:base.id,type,id:crypto.randomUUID(),icon:'🧪',w:1,h:1}}

function beginBagPlacement(item,onPlaced,movingId=null,onCancel=null){

function cancelBagPlacement(){

function rotateBagItem(direction){

function resizeBag(delta){

function addInventoryItem(type,source='reward'){

  return loaded;
}
function showMenuNotice(title,text){
  $('#modal').className='modal';
  $('#modal').innerHTML=`<h2>${title}</h2><p>${text}</p><button class="primary" id="menuNoticeOk" type="button">확인</button>`;
  $('#overlay').classList.remove('hidden');
  $('#menuNoticeOk').onclick=()=>$('#overlay').classList.add('hidden');
}
function saveGame(){
  if(state.hero===null||!state.deck?.length){showMenuNotice('저장할 기록이 없습니다.','먼저 등반을 시작하십시오.');return}
  try{localStorage.setItem(SAVE_KEY,saveStateJSON());showMenuNotice('저장 완료','현재 등반 기록을 저장했습니다.')}catch{showMenuNotice('저장 실패','이 브라우저에서는 저장 기능을 사용할 수 없습니다.')}}
function loadGame(){
  window.TOE_COMBAT_MOTION?.clear();
  let saved;
  try{saved=localStorage.getItem(SAVE_KEY)}catch{showMenuNotice('불러오기 실패','이 브라우저에서는 저장 기능을 사용할 수 없습니다.');return}
  if(!saved){showMenuNotice('불러오기','저장된 등반 기록이 없습니다.');return}
  try{
    const loaded=loadStateJSON(saved);Object.assign(state,loaded);state.roomState=loaded.roomState||null;
    const loadedHero=HEROES[state.hero];state.maxMana=loadedHero?.resourceMax||3;if(!Number.isFinite(state.mana))state.mana=state.maxMana;if(!Number.isFinite(state.innerQi))state.innerQi=state.hero===6?3:0;
    if(state.hero===6){const seen=new Set();for(const pile of [state.deck,state.hand,state.draw,state.discard,state.exhaust])for(const c of pile||[]){if(!c||seen.has(c.id))continue;seen.add(c.id);if(c.name?.replace(/\*/g,'')===loadedHero.guard){c.keyword='수비';c.actionCost=1;c.innerCost=0}}}
    document.body.classList.remove('menu-open');$('#startScreen').classList.remove('selecting');
    $('#startScreen').classList.add('hidden');
    const activeNode=state.map?.nodes instanceof Map?state.map.nodes.get(state.map.active):null;
    const inBattle=Array.isArray(state.enemies)&&state.enemies.some(enemy=>enemy.hp>0)&&(state.roomState?.phase==='battle'||!state.roomState&&['monster','elite','boss'].includes(activeNode?.type));
    if(inBattle){document.body.classList.add('in-battle');$('#overlay').classList.add('hidden');$('#battleScreen').classList.remove('hidden');renderBattle();startStageBgm(state.stage)}
    else if(window.restoreRoomState?.()){}
    else if(state.map?.nodes instanceof Map){showMap()}
    else{beginStage()}
    sync();
  }catch{showMenuNotice('불러오기 실패','저장 기록을 읽을 수 없습니다.')}
}
function openTitleSettings(){
  $('#modal').className='modal settings-modal';
  $('#modal').innerHTML=`<h2>설정</h2><div class="settings-list"><label><span>스테이지 배경음악</span><button class="choice" id="settingsBgm" type="button">${battleMusic.enabled?'켜짐':'꺼짐'}</button></label></div><button class="primary" id="closeSettings" type="button">닫기</button>`;
  $('#overlay').classList.remove('hidden');
  $('#settingsBgm').onclick=()=>{battleMusic.enabled=!battleMusic.enabled;$('#settingsBgm').textContent=battleMusic.enabled?'켜짐':'꺼짐';updateBgmButton()};
  $('#closeSettings').onclick=()=>$('#overlay').classList.add('hidden');
}
$('#menuStart').onclick=()=>{$('#titleMenu').classList.add('hidden');$('#heroSelectPanel').classList.remove('hidden');$('#startScreen').classList.add('selecting');selectHero(state.hero??0,false)};
$('#menuBack').onclick=()=>{$('#heroSelectPanel').classList.add('hidden');$('#titleMenu').classList.remove('hidden');$('#startScreen').classList.remove('selecting')};
$('#menuSettings').onclick=openTitleSettings;
$('#menuLoad').onclick=loadGame;
$('#menuSave').onclick=saveGame;
const battleMenu=$('#battleMenu'),battleMenuToggle=$('#battleMenuToggle');
function closeBattleMenu(){battleMenu.classList.add('hidden');battleMenuToggle.setAttribute('aria-expanded','false')}
battleMenuToggle.onclick=()=>{const opening=battleMenu.classList.toggle('hidden')===false;battleMenuToggle.setAttribute('aria-expanded',String(opening))};
document.addEventListener('pointerdown',event=>{if(!battleMenu.contains(event.target)&&event.target!==battleMenuToggle)closeBattleMenu()});
function confirmBattleExit(quit){
  $('#modal').className='modal';$('#modal').innerHTML=`<h2>${quit?'게임 종료':'시작화면으로'}</h2><p>저장하지 않은 진행 상황은 사라집니다. 계속하시겠습니까?</p><div class="choices"><button class="choice" id="cancelExit" type="button">계속 플레이</button><button class="choice" id="confirmExit" type="button">${quit?'종료':'시작화면으로'}</button></div>`;
  $('#overlay').classList.remove('hidden');$('#cancelExit').onclick=()=>$('#overlay').classList.add('hidden');
  $('#confirmExit').onclick=()=>{window.TOE_COMBAT_MOTION?.clear();closeBag();closePile();closeBattleMenu();stopStageBgm();$('#overlay').classList.add('hidden');document.body.classList.remove('in-battle');$('#battleScreen').classList.add('hidden');$('#startScreen').classList.remove('hidden','selecting');$('#heroSelectPanel').classList.add('hidden');$('#titleMenu').classList.remove('hidden');document.body.classList.add('menu-open');if(quit)location.reload()};
}
battleMenu.querySelectorAll('[data-battle-menu]').forEach(button=>button.onclick=()=>{
  closeBattleMenu();const action=button.dataset.battleMenu;
  if(action==='save')saveGame();else if(action==='settings')openTitleSettings();else confirmBattleExit(action==='quit');
});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeBattleMenu()});
